<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lead Pipeline{% if title %} — {{ title }}{% endif %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: #0f1117; font-size: 14px; }
    .sidebar { width: 220px; min-height: 100vh; background: #161b22; border-right: 1px solid #30363d; position: fixed; top: 0; left: 0; z-index: 100; }
    .sidebar .nav-link { color: #8b949e; padding: 10px 20px; border-radius: 6px; margin: 2px 8px; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #21262d; color: #f0f6fc; }
    .sidebar .nav-link i { margin-right: 8px; width: 16px; }
    .main { margin-left: 220px; padding: 24px; }
    .logo { padding: 20px; font-size: 15px; font-weight: 600; color: #f0f6fc; border-bottom: 1px solid #30363d; margin-bottom: 8px; }
    .stat-card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px 24px; }
    .stat-card .label { color: #8b949e; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
    .stat-card .value { font-size: 28px; font-weight: 700; color: #f0f6fc; margin: 4px 0 0; }
    .stat-card .sub { font-size: 12px; color: #8b949e; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; }
    .card-header { background: #21262d; border-bottom: 1px solid #30363d; font-weight: 600; }
    table.dataTable thead th { background: #21262d; color: #8b949e; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; border-bottom: 1px solid #30363d !important; }
    table.dataTable tbody tr { background: #161b22 !important; }
    table.dataTable tbody tr:hover td { background: #1c2128 !important; }
    table.dataTable tbody td { border-color: #21262d !important; color: #e6edf3; vertical-align: middle; }
    .dataTables_wrapper .dataTables_filter input,
    .dataTables_wrapper .dataTables_length select { background: #21262d; border: 1px solid #30363d; color: #e6edf3; border-radius: 6px; padding: 4px 10px; }
    .dataTables_wrapper .dataTables_info, .dataTables_wrapper .dataTables_paginate { color: #8b949e; }
    .page-link { background: #21262d; border-color: #30363d; color: #8b949e; }
    .page-item.active .page-link { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    .badge-deliverable { background: #1a7f37; }
    .badge-unknown { background: #1f6feb; }
    .badge-unverified { background: #9e6a03; }
    .badge-undeliverable { background: #b91c1c; }
    .badge-confirmed { background: #2d8a4e; }
    .progress { background: #21262d; height: 8px; border-radius: 4px; }
    .btn-run { background: #1f6feb; border: none; color: white; }
    .btn-run:hover { background: #388bfd; color: white; }
    .section-title { color: #f0f6fc; font-size: 18px; font-weight: 600; margin-bottom: 20px; }
    pre.log-output { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 16px; color: #7ee787; font-size: 12px; max-height: 400px; overflow-y: auto; }
    .divider { border-color: #30363d; margin: 24px 0; }
  </style>
</head>
<body>

<nav class="sidebar d-flex flex-column">
  <div class="logo"><i class="bi bi-database-fill-gear text-primary"></i> Lead Pipeline</div>
  <ul class="nav flex-column flex-grow-1">
    <li class="nav-item"><a class="nav-link {% if active=='overview' %}active{% endif %}" href="/"><i class="bi bi-grid-1x2-fill"></i>Overview</a></li>
    <li class="nav-item"><a class="nav-link {% if active=='companies' %}active{% endif %}" href="/companies"><i class="bi bi-building"></i>Companies</a></li>
    <li class="nav-item"><a class="nav-link {% if active=='verified' %}active{% endif %}" href="/contacts/verified"><i class="bi bi-patch-check-fill"></i>Verified Contacts</a></li>
    <li class="nav-item mt-2"><hr class="divider mx-3 my-1"></li>
    <li class="nav-item"><a class="nav-link {% if active=='pipeline' %}active{% endif %}" href="/pipeline"><i class="bi bi-play-circle-fill"></i>Run Pipeline</a></li>
    <li class="nav-item"><a class="nav-link {% if active=='clean' %}active{% endif %}" href="/clean"><i class="bi bi-shield-fill-check"></i>Verify & Clean</a></li>
    <li class="nav-item"><a class="nav-link {% if active=='outreach' %}active{% endif %}" href="/outreach"><i class="bi bi-send-fill"></i>Outreach</a></li>
    <li class="nav-item"><a class="nav-link {% if active=='responses' %}active{% endif %}" href="/responses"><i class="bi bi-reply-fill"></i>Responses</a></li>
  </ul>
</nav>

<main class="main">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>
<script src="https://cdn.datatables.net/2.0.8/js/dataTables.bootstrap5.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
